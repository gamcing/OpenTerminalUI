name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-and-test:
    # Playwright 1.58 does not support ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version sync
        run: python3 scripts/check_version_sync.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python compileall
        run: python -m compileall backend

      - name: Run pytest with coverage
        run: PYTHONPATH=. pytest backend/tests -q --cov=backend --cov-fail-under=45 --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            pytest-report.xml
            coverage.xml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cloudflare Worker tests
        run: npm run test:cloudflare

      - name: Cloudflare local D1 integration
        shell: bash
        run: |
          set -euo pipefail
          setsid npx --yes wrangler@4 dev --local --config cloudflare/wrangler.d1-test.jsonc \
            --port 8899 --ip 127.0.0.1 \
            --var D1_BRIDGE_TOKEN:test-secret-only-not-for-production-1234567890 \
            --persist-to "$RUNNER_TEMP/openterminalui-d1" > "$RUNNER_TEMP/wrangler-d1.log" 2>&1 &
          worker_pid=$!
          trap 'kill -- -"$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..90}; do
            if curl -s -o /dev/null http://127.0.0.1:8899/batch; then ready=1; break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then cat "$RUNNER_TEMP/wrangler-d1.log"; exit 1; fi
          node cloudflare/d1-local.integration.mjs
          python -m cloudflare.d1_local_integration
          python -m cloudflare.identity_local_integration
          python -m cloudflare.identity_auth_local_integration
          python -m cloudflare.identity_migration_local_integration
          python -m cloudflare.identity_staging_local_integration
          python -m cloudflare.saved_views_local_integration
          python -m cloudflare.saved_views_api_local_integration

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Frontend unit tests (Vitest)
        run: |
          cd frontend
          set -o pipefail
          npx vitest run 2>&1 | tee vitest.log
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: |
          npm run test:e2e --prefix frontend

      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('coverage.xml', 'utf8');
            const m = xml.match(/line-rate=\"([0-9.]+)\"/);
            const pct = m ? (Number(m[1]) * 100).toFixed(2) : 'unknown';
            const body = `Backend coverage: **${pct}%** (threshold: 45%)`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
